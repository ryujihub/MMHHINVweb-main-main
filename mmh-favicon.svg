<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="64" height="64" fill="transparent"/>
  
  <!-- Hardware Store Building -->
  <g transform="translate(8, 4)">
    <!-- Roof Structure -->
    <polygon points="0,16 24,4 48,16 48,20 0,20" fill="#2d5a3d" stroke="#1a3d2e" stroke-width="1"/>
    
    <!-- Roof Windows -->
    <rect x="4" y="8" width="6" height="4" fill="#4a9d5f" stroke="#2d5a3d" stroke-width="0.5"/>
    <rect x="21" y="8" width="6" height="4" fill="#4a9d5f" stroke="#2d5a3d" stroke-width="0.5"/>
    <rect x="38" y="8" width="6" height="4" fill="#4a9d5f" stroke="#2d5a3d" stroke-width="0.5"/>
    
    <!-- Window Frames -->
    <line x1="7" y1="8" x2="7" y2="12" stroke="#2d5a3d" stroke-width="0.5"/>
    <line x1="4" y1="10" x2="10" y2="10" stroke="#2d5a3d" stroke-width="0.5"/>
    <line x1="24" y1="8" x2="24" y2="12" stroke="#2d5a3d" stroke-width="0.5"/>
    <line x1="21" y1="10" x2="27" y2="10" stroke="#2d5a3d" stroke-width="0.5"/>
    <line x1="41" y1="8" x2="41" y2="12" stroke="#2d5a3d" stroke-width="0.5"/>
    <line x1="38" y1="10" x2="44" y2="10" stroke="#2d5a3d" stroke-width="0.5"/>
    
    <!-- Awning -->
    <rect x="0" y="20" width="48" height="6" fill="#ff8c00" stroke="#e67300" stroke-width="1"/>
    
    <!-- Awning Scallops -->
    <g fill="#ff6b00">
      <ellipse cx="4" cy="23" rx="2" ry="1.5"/>
      <ellipse cx="10" cy="23" rx="2" ry="1.5"/>
      <ellipse cx="16" cy="23" rx="2" ry="1.5"/>
      <ellipse cx="22" cy="23" rx="2" ry="1.5"/>
      <ellipse cx="28" cy="23" rx="2" ry="1.5"/>
      <ellipse cx="34" cy="23" rx="2" ry="1.5"/>
      <ellipse cx="40" cy="23" rx="2" ry="1.5"/>
      <ellipse cx="44" cy="23" rx="2" ry="1.5"/>
    </g>
    
    <!-- Main Building -->
    <rect x="0" y="26" width="48" height="24" fill="#4a9d5f" stroke="#2d5a3d" stroke-width="1"/>
    
    <!-- Store Front Sections -->
    <!-- Left Section -->
    <rect x="2" y="28" width="12" height="20" fill="#4a9d5f" stroke="#2d5a3d" stroke-width="0.5"/>
    
    <!-- Center Section (Door) -->
    <rect x="16" y="30" width="16" height="18" fill="#8b4513" stroke="#654321" stroke-width="0.5"/>
    
    <!-- Right Section -->
    <rect x="34" y="28" width="12" height="20" fill="#4a9d5f" stroke="#2d5a3d" stroke-width="0.5"/>
    
    <!-- Windows -->
    <rect x="4" y="30" width="8" height="6" fill="#87ceeb" stroke="#5f9ea0" stroke-width="0.5"/>
    <rect x="36" y="30" width="8" height="6" fill="#87ceeb" stroke="#5f9ea0" stroke-width="0.5"/>
    
    <!-- Door Details -->
    <rect x="18" y="32" width="12" height="16" fill="#a0522d" stroke="#8b4513" stroke-width="0.3"/>
    <circle cx="28" cy="40" r="0.8" fill="#ffd700"/>
    
    <!-- Hardware Store Items -->
    <rect x="36" y="38" width="8" height="8" fill="#ff8c00" stroke="#e67300" stroke-width="0.3"/>
    
    <!-- Cross Pattern in Orange Box -->
    <g transform="translate(40, 42)" stroke="#2d5a3d" stroke-width="1" fill="none">
      <line x1="0" y1="0" x2="4" y2="4"/>
      <line x1="4" y1="0" x2="0" y2="4"/>
    </g>
    
    <!-- Tools Display -->
    <g transform="translate(6, 38)" fill="#2d5a3d">
      <rect x="0" y="2" width="1" height="6" rx="0.5"/>
      <rect x="2" y="2" width="1" height="6" rx="0.5"/>
      <rect x="4" y="2" width="1" height="6" rx="0.5"/>
    </g>
  </g>
  
  <!-- MMH HARDWARE Text -->
  <g transform="translate(4, 54)" fill="#2d5a3d" font-family="Arial, sans-serif" font-size="8" font-weight="bold">
    <text x="0" y="0">MMH</text>
    <text x="0" y="8" font-size="4">HARDWARE</text>
  </g>
</svg>